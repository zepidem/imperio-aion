<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Império AION · Sobreposição</title><style>
:root{color-scheme:dark;--bg:#241b15;--surface:#30251d;--gold:#d5a65f;--muted:#d6bea2;--ink:#fff5e8;--line:#513c29}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink);font:12px 'Segoe UI',sans-serif;overflow:hidden}h1,h2,p{margin:0}img{object-fit:contain}#overlay{width:100vw;height:100vh;overflow:hidden}.surface{border:1px solid #a17b45;border-radius:14px;background:rgba(36,27,21,.94);overflow:hidden}.hud{width:390px;height:370px;padding:13px;display:flex;flex-direction:column;gap:10px}.hud header{display:flex;gap:9px;align-items:center;min-height:39px}.hud header img{width:39px;height:42px}.hud h1{font-size:12px;color:#eed0a1}.hud header small{display:block;font-size:10px;color:var(--muted);margin-top:5px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;height:27px;flex:none}.tabs span{padding-bottom:8px;border-bottom:2px solid transparent}.tabs .active{color:var(--gold);border-color:var(--gold)}.hud-content{flex:1;min-height:0;overflow:hidden}.rank-head,.rank-row{display:grid;grid-template-columns:22px 1fr 76px 48px;align-items:center;gap:7px}.rank-head{font-size:9px;color:var(--muted);margin:0 7px 6px}.rank-head span:last-child{grid-column:3/5;text-align:right}.rank-row{height:30px;margin-top:4px;padding:0 7px;position:relative;isolation:isolate;overflow:hidden;border-radius:6px}.rank-row:before{content:'';position:absolute;inset:0 auto 0 0;width:var(--share);background:var(--color);opacity:.11;z-index:-1}.rank-row img{width:21px;height:21px}.rank-row strong{font-size:11px;color:var(--color);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rank-row span,.rank-row small{text-align:right;font-variant-numeric:tabular-nums}.rank-row small{font-size:10px;color:var(--muted)}.metrics{display:flex;gap:22px;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:11px}.metrics strong{display:block;color:#f0d19a;font-size:12px;margin-top:3px}.resources{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:9px;flex:none;font-size:10px;color:#e2c38e}.resources span{display:flex;gap:4px;align-items:center}.resources img{width:19px;height:19px}.activity{display:grid;gap:4px}.activity-row{height:28px;background:var(--surface);border-radius:6px;padding:3px 7px;display:grid;grid-template-columns:1fr auto;gap:0 8px}.activity-row strong{font-size:10px;color:#e6c7a3}.activity-row small{font-size:8px;color:#bda17e;grid-row:2}.activity-row b{grid-column:2;grid-row:1/3;align-self:center;color:#e4c08a;font-size:12px}.pet{display:grid;grid-template-columns:30px 1fr auto;gap:4px 7px;align-items:center;margin-bottom:7px;padding:6px;background:var(--surface);border-radius:7px}.pet img{width:30px;height:30px;grid-row:1/3}.pet strong,.pet b{font-size:10px}.pet b,.pet small{color:#e4c08a;text-align:right}.pet span,.pet small{font-size:8px}.pet small{grid-column:2/4}.waiting{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;color:var(--muted);line-height:1.6}.waiting strong{color:var(--gold);font-size:14px}.panel{width:1100px;height:620px;padding:20px;display:flex;flex-direction:column;gap:12px}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:30px}.panel h1{font-size:20px}.target{font-size:11px;max-width:50%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;color:#eed0a1}.panel-metrics{display:flex;justify-content:flex-end;gap:22px;color:var(--muted);font-size:10px}.panel-metrics b{color:var(--ink);margin-right:5px}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.column{min-width:0}.column-title{display:flex;gap:10px;align-items:center;height:29px;margin-bottom:7px}.column h2{font-size:13px}.column-title small{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table-frame{height:279px;overflow:auto;border:1px solid #765332;border-radius:9px;background:#2b2019;scrollbar-width:thin;scrollbar-color:#a17b45 #241b15}table{border-collapse:collapse;width:100%;font-size:10px;font-variant-numeric:tabular-nums}thead{position:sticky;top:0;background:#38291e;z-index:2}th{text-align:right;color:#e2c8a2;font-size:9px;height:27px;padding:0 5px;white-space:nowrap}td{height:25px;padding:0 5px;text-align:right;white-space:nowrap;border-bottom:1px solid #493527}td:first-child,th:first-child{text-align:left}td:nth-child(2),th:nth-child(2){text-align:left}.skill-table td:nth-child(2),.skill-table th:nth-child(2){text-align:right}.skill-table td:first-child{max-width:255px;overflow:hidden;text-overflow:ellipsis}.cell{display:flex;gap:5px;align-items:center}.cell img,.class-icon{width:19px;height:19px;vertical-align:middle}.selected td{background:#493225}.footnote{height:22px;padding-top:5px;font-size:8px;color:var(--muted)}.chart-heading{display:flex;align-items:center;justify-content:space-between;font-size:10px;height:26px}.chart-heading small{font-size:9px;color:var(--gold)}.chart{display:block;width:100%;height:auto;aspect-ratio:980/226}.chart text{fill:var(--muted);font-size:16px}.chart .grid{stroke:var(--line);stroke-dasharray:3 5;stroke-width:1}.chart polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.partial{color:#edc281;font-size:9px}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#a17b45;border:2px solid #2b2019;border-radius:8px}::-webkit-scrollbar-track{background:#2b2019}
</style></head><body><div id="overlay" aria-live="off"></div><script>
'use strict';
const root=document.querySelector('#overlay');let prior='',failed=false;
const number=(v,d=0)=>v==null?'—':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});
const compact=v=>v==null?'—':v>=1e6?number(v/1e6,1)+'M':v>=1000?number(v/1000,1)+'K':number(v);
const duration=v=>v>=60?Math.floor(v/60)+'m '+Math.floor(v%60)+'s':number(v,1)+'s';
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function icon(path,alt=''){const img=el('img','class-icon');if(path)img.src=path;else img.hidden=true;img.alt=alt;return img;}
function waiting(parent,d){const box=el('div','waiting');box.append(el('strong','',d.waitingTitle),el('span','',d.waitingNote));parent.append(box);}
function renderHUD(d){
 const h=el('div','surface hud'),head=el('header'),labels={combat:'Combate',duty:'Diárias e Semanais',pets:'Mascotes'},text=el('div');
 text.append(el('h1','',labels[d.view]+(d.character?' · '+d.character:'')),el('small','',d.view==='combat'?d.target:d.view==='pets'?'Coleção do personagem':'Progresso do personagem'));
 head.append(icon(d.logo),text);h.append(head);const tabs=el('div','tabs');for(const [key,label]of Object.entries(labels))tabs.append(el('span',key===d.view?'active':'',label));h.append(tabs);
 const content=el('div','hud-content');h.append(content);
 if(!d.ready)waiting(content,d);
 else if(d.view==='duty'){const list=el('div','activity');for(const row of d.activities||[]){const e=el('div','activity-row');e.append(el('strong','',row.name),el('small','',row.note),el('b','',row.count));list.append(e);}content.append(list);}
 else if(d.view==='pets'){for(const p of d.pets||[]){const row=el('div','pet');row.append(icon(p.icon),el('strong','',p.name),el('b','',p.caption),el('small','',p.note));content.append(row);}if(!d.pets?.length)content.append(el('div','waiting','Aguardando dados da coleção.'));}
 else{
  const heading=el('div','rank-head');heading.append(el('span',''),el('span','','Personagem'),el('span','','Dano total / DPS'));content.append(heading);
  const peak=Math.max(1,...d.rows.map(r=>r.damage||0));for(const r of d.rows){const row=el('div','rank-row');row.style.setProperty('--color',r.color);row.style.setProperty('--share',(r.damage||0)/peak*100+'%');row.append(icon(r.icon,r.className),el('strong','',r.name),el('span','',compact(r.damage)),el('small','',compact(r.dps)));content.append(row);}
  const metrics=el('div','metrics');for(const[label,value]of [['Dano do grupo',compact(d.total)],['DPS médio',compact(d.dps)],['Tempo',duration(d.seconds)]]){const m=el('span','',label);m.append(el('strong','',value));metrics.append(m);}content.append(metrics);
  if(d.partial)content.append(el('small','partial','Leitura parcial do combate'));
 }
 if(d.resources.length){const r=el('div','resources');for(const item of d.resources){const span=el('span');span.append(icon(item.icon),el('b','',item.text));r.append(span);}h.append(r);}return h;
}
function metric(parent,label,value){const m=el('span');m.append(el('b','',value),document.createTextNode(label));parent.append(m);}
function chart(curves,mode,selected,seconds){
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.classList.add('chart');svg.setAttribute('viewBox','0 0 980 226');svg.setAttribute('role','img');svg.setAttribute('aria-label',mode==='second'?'Dano por segundo no tempo':'Dano acumulado no tempo');
 function part(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!=null)e.textContent=text;svg.append(e);return e;}
 const max=Math.max(1,...curves.flatMap(c=>c[mode].map(p=>p[1]))),X=t=>52+t/Math.max(1,seconds)*910,Y=v=>165-v/max*143;
 part('text',{x:52,y:15},mode==='second'?'Dano/s':'Dano');for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);part('line',{x1:52,x2:962,y1:y,y2:y,class:'grid'});part('text',{x:43,y:y+4,'text-anchor':'end'},compact(v));}
 for(let i=0;i<=5;i++){const t=seconds*i/5;part('text',{x:X(t),y:190,'text-anchor':i===0?'start':i===5?'end':'middle'},duration(t));}
 part('text',{x:505,y:220,'text-anchor':'middle'},'Tempo de combate');
 const ordered=[...curves.filter(c=>c.key!==selected),...curves.filter(c=>c.key===selected)];for(const c of ordered)part('polyline',{points:c[mode].map(p=>X(p[0]).toFixed(2)+','+Y(p[1]).toFixed(2)).join(' '),stroke:c.color,opacity:selected&&c.key!==selected?.25:1});return svg;
}
function table(headers,rows,skills=false){const frame=el('div','table-frame'),t=el('table',skills?'skill-table':''),head=el('thead'),tr=el('tr'),body=el('tbody');for(const h of headers)tr.append(el('th','',h));head.append(tr);t.append(head,body);for(const row of rows)body.append(row);frame.append(t);return frame;}
function renderPanel(d){
 const panel=el('div','surface panel'),heading=el('div','panel-header');heading.append(el('h1','',d.title),el('span','target',d.target));panel.append(heading);if(!d.ready){waiting(panel,d);return panel;}
 const metrics=el('div','panel-metrics');metric(metrics,'dano do grupo',compact(d.total));metric(metrics,'DPS médio',compact(d.dps));metric(metrics,'de combate',duration(d.seconds));if(d.partial)metrics.append(el('span','partial','Leitura parcial'));panel.append(metrics);
 const columns=el('div','columns'),left=el('section','column'),right=el('section','column');columns.append(left,right);panel.append(columns);
 const ltitle=el('div','column-title'),rtitle=el('div','column-title');ltitle.append(el('h2','','Rank de dano'));rtitle.append(el('h2','','Habilidades'),el('small','',d.selectedName));left.append(ltitle);right.append(rtitle);
 const rows=d.rows.map(r=>{const tr=el('tr',r.key===d.selected?'selected':'');const cls=el('td'),name=el('td','',r.name);cls.append(icon(r.icon,r.className));name.style.color=r.color;tr.append(cls,name,...[number(r.damage),compact(r.dps),duration(r.seconds),number(r.share,1)+'%'].map(v=>el('td','',v)));return tr;});
 left.append(table(['Classe','Personagem','Dano total','DPS Médio','Tempo','Dano (%)'],rows));
 const skills=d.skills.map(s=>{const tr=el('tr',s.key===d.selectedSkill?'selected':''),cell=el('td'),wrap=el('div','cell');wrap.append(icon(s.icon),el('strong','',s.name));wrap.style.color=s.color;cell.append(wrap);tr.append(cell,...[number(s.records),number(s.damage),number(s.share,1)+'%'].map(v=>el('td','',v)));return tr;});
 right.append(table(['Habilidade','Registros','Dano total','Dano (%)'],skills,true));
 for(const[col,title,note,mode,lines,focus]of [[left,'Dano do grupo','Participação no dano registrado no alvo.',d.groupMode,d.groupCurves,d.groupFocus],[right,'Dano de '+(d.selectedName||'personagem'),'Registros de dano não equivalem a ativações.',d.skillMode,d.skillCurves,d.selectedSkill]]){col.append(el('div','footnote',note));const h=el('div','chart-heading');h.append(el('strong','',title),el('small','',mode==='second'?'Dano por segundo':'Dano acumulado'));col.append(h,chart(lines,mode,focus,d.seconds));}
 return panel;
}
async function refresh(){try{const response=await fetch('state',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)throw Error('inactive');const raw=await response.text();if(raw!==prior||failed){const data=JSON.parse(raw);if(!data.kind)throw Error('waiting');root.replaceChildren(data.kind==='hud'?renderHUD(data):renderPanel(data));prior=raw;failed=false;}}catch{root.replaceChildren();failed=true;}finally{setTimeout(refresh,500);}}refresh();
</script></body></html>
