name: Verify sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Audit sources before dependency installation
        run: python tools/audit_repository.py
      - name: Install test dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Run offline tests
        run: python tools/run_tests.py
      - name: Compile native helper without running it
        run: python tools/build_native.py

# Source checks only: no credentials, signing, release upload, driver loading,
# capture, installation, or deployment. This is not a complete release build.
